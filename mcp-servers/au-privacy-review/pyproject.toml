[project]
name = "au-privacy-review"
version = "0.2.0"
description = "MCP server that reviews an Australian project for privacy issues under the Australian Privacy Principles: findings ranked by decided-case precedent, face-value APP contraventions and cautions, open questions with the evidence that would settle them, and a draft privacy threshold assessment. Verified legislation and case-law citations."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.15"
authors = [{ name = "DeepCivic" }]
keywords = ["mcp", "privacy", "australia", "app", "privacy-act", "pia", "privacy-review", "privacy-threshold-assessment", "compliance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.22",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/DeepCivic/civic-lab/tree/main/mcp-servers/au-privacy-review"
Repository = "https://github.com/DeepCivic/civic-lab"
Documentation = "https://github.com/DeepCivic/civic-lab/tree/main/mcp-servers/au-privacy-review/docs"
Changelog = "https://github.com/DeepCivic/civic-lab/blob/main/mcp-servers/au-privacy-review/CHANGELOG.md"

[project.scripts]
au-privacy-review = "au_privacy_review.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/au_privacy_review"]

[tool.hatch.build.targets.sdist]
exclude = ["tests/fixtures/**/*.pyc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: makes network calls (AU_PRIVACY_REVIEW_LIVE_TESTS=1)"]
