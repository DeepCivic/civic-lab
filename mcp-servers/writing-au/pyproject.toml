[project]
name = "writing-au"
version = "0.1.0"
description = "MCP server providing deterministic Australian English writing checks: spelling, grammar, and reading level."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "mcp>=1.22,<2",  # 2.x renamed FastMCP; older 1.x breaks on current pydantic
    "spylls>=0.1.7",
    "textstat>=0.7.8",  # older releases need pkg_resources / differ in syllable counts
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
writing-au = "writing_au.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/writing_au"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
