[project]
name = "abr-au"
version = "0.1.0"
description = "MCP server for Australian Business Register (ABN Lookup) data: offline ABN/ACN validation, a local bulk-extract index, and optional live ABR web services."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.15"
authors = [{ name = "DeepCivic" }]
keywords = ["mcp", "abn", "acn", "australia", "abr", "business-register"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=1.22",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/DeepCivic/civic-lab/tree/main/mcp-servers/abr-au"
Repository = "https://github.com/DeepCivic/civic-lab"

[project.scripts]
abr-au = "abr_au.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abr_au"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: calls the live ABN Lookup web services (ABR_LIVE=1)"]
