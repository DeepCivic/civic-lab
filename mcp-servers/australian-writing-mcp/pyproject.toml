[project]
name = "australian-writing-mcp"
version = "0.1.0"
description = "MCP server providing deterministic Australian English writing checks: spelling, grammar, and reading level."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "spylls>=0.1.7",
    "textstat>=0.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
australian-writing-mcp = "australian_writing.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/australian_writing"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
