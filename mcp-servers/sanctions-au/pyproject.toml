[project]
name = "sanctions-au"
version = "0.1.0"
description = "MCP server for screening against Australian sanctions data: the DFAT Consolidated List and the ABF Register of Sanctioned Sponsors, from locally held, versioned snapshots."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.15"
authors = [{ name = "DeepCivic" }]
keywords = ["mcp", "sanctions", "dfat", "abf", "screening", "australia", "compliance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=1.22",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/DeepCivic/civic-lab/tree/main/mcp-servers/sanctions-au"
Repository = "https://github.com/DeepCivic/civic-lab"

[project.scripts]
sanctions-au = "sanctions_au.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sanctions_au"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
